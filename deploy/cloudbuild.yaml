steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -f
      - deploy/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/sport-assistant:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/sport-assistant:${_TAG}
substitutions:
  _REGION: us-central1
  _REPOSITORY: polar-assistant
  _TAG: qa
timeout: 1200s
