[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-verity-sense-assistant"
version = "0.1.0"
description = "ADK agent for governed analysis of Polar exercise telemetry"
requires-python = ">=3.10"
dependencies = [
  "google-adk",
  "pydantic>=2",
  "requests>=2.32",
  "fitparse>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
